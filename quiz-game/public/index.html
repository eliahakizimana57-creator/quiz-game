<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizBuzz – Home</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="card" style="text-align:center;">
    <div class="logo" style="font-size:3rem;">Quiz<span>Buzz</span></div>
    <p class="subtitle" style="font-size:1.05rem; margin-bottom:2rem;">
      Real-time multiplayer quiz with QR code &amp; PIN login
    </p>
    <a href="host.html" style="text-decoration:none;">
      <button class="btn btn-primary" style="font-size:1.1rem; padding:1rem 2rem;">
        🎮 Host a Game
      </button>
    </a>
    <a href="join.html" style="text-decoration:none;">
      <button class="btn btn-secondary" style="font-size:1.1rem; padding:1rem 2rem; margin-top:.75rem;">
        🚀 Join a Game
      </button>
    </a>
    <hr class="divider" />
    <p style="color:var(--muted); font-size:.85rem;">
      Hosts create a room and share the PIN or QR code.<br/>
      Players scan or type the 6-digit PIN to join instantly.
    </p>
  </div>
</body>
</html>
